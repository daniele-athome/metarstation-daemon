name: test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    container: debian:trixie

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            ca-certificates git python3-venv \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
            python3-brotli python3-attr python3-jinja2 python3-certifi \
            python3-idna python3-markupsafe python3-requests python3-urllib3 \
            python3-packaging python3-pygments

      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-

      - name: Install project
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install . --group pyproject.toml:dev \
            pytest-md-report pytest-github-actions-annotate-failures

      - name: Run tests
        run: >
          .venv/bin/pytest
          --md-report
          --md-report-flavor gfm
          --md-report-color never
          --md-report-output=md-report.md

      - name: Publish test report
        if: always()
        run: |
          if [ -f md-report.md ]; then
            {
              echo "## Test report"
              echo
              cat md-report.md
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No test report produced: pytest failed before running any test." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
