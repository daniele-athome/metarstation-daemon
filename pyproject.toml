[project]
name = "metarstation_daemon"
version = "0.0.1"
description = "Weather station on-device daemon"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bleak>=2.1.1,<2.2.0",
    "bthome-ble>=3.19.1,<3.20.0",
    "dataclasses-json==0.6.7",
    "httpx==0.28.1",
    "pytapo>=3.3.54,<3.4.0",
    "python-kasa==0.10.2",
    # actually a workaround to avoid looking through all versions of habluetooth
    "habluetooth<6.8"
]

[project.scripts]
weather-daemon = "metarstation_daemon:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
