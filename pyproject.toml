[project]
name = "metarstation_daemon"
version = "0.0.1"
description = "Weather station on-device daemon"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bleak>=2.1.1,<3",
    "bthome-ble>=3.19.1,<4",
    "bluetooth-data-tools>=1.29.24,<1.30.0",
    "sensor-state-data>=2.20.0,<3",
    "mashumaro>=3.22,<4",
    "httpx==0.28.1",
    "pytapo>=3.4.30,<3.5",
    "python-kasa==0.12.0",
    # actually a workaround to avoid looking through all versions of habluetooth
    "habluetooth==6.7.2",
    "weasyprint>=70",
    "pillow>=12,<13",
    "jinja2>=3.1,<4"
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
weather-daemon = "metarstation_daemon:main"
